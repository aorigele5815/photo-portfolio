name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'photos.json'
      - 'index.html'
      - 'admin.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Configure wrangler
        run: |
          mkdir -p ~/.config/.wrangler
          echo 'account_id = "38b114fc42e8ef8c31f49eda5bc2fec0"' > ~/.config/.wrangler/config/default.toml
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler pages deploy . --project-name=photo-portfolio
