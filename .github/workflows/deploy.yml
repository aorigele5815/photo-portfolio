name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'photos.json'
      - 'index.html'
      - 'admin.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure wrangler
        run: |
          mkdir -p ~/.config/.wrangler
          cat > ~/.config/.wrangler/config.toml << 'TOML'
[defaults]
account_id = "38b114fc42e8ef8c31f49eda5bc2fec0"
TOML
      - name: Deploy via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          wrangler pages deploy . --project-name=photo-portfolio

# Trigger update
