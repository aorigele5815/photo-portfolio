name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'photos.json'
      - 'index.html'
      - 'admin.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Cloudflare Pages API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID="38b114fc42e8ef8c31f49eda5bc2fec0"
          PROJECT="photo-portfolio"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main","production":true}'
