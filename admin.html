<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烂片王中王 · 管理后台</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --card: #111;
  --border: #222;
  --gold: #c9a96e;
  --gold2: #a8895a;
  --text: #e8e8e8;
  --text2: #888;
  --danger: #c0392b;
  --success: #27ae60;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid var(--border);
}
.nav .logo {
  font-size: 1.2rem;
  letter-spacing: 2px;
  color: var(--gold);
  text-decoration: none;
}
.nav .logo span { color: var(--text2); font-size: 0.9rem; margin-left: 12px; }
.nav-right { display: flex; gap: 12px; align-items: center; }
.nav a.btn {
  padding: 8px 20px;
  border: 1px solid var(--gold);
  color: var(--gold);
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 1px;
  transition: all 0.3s;
  cursor: pointer;
}
.nav a.btn:hover { background: var(--gold); color: var(--bg); }

/* ── Login ── */
#login-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 80px);
  padding: 40px;
}
#login-view h1 {
  font-size: 2rem;
  font-weight: 300;
  color: var(--gold);
  margin-bottom: 8px;
  letter-spacing: 4px;
}
#login-view .sub {
  color: var(--text2);
  font-size: 1rem;
  margin-bottom: 40px;
  letter-spacing: 2px;
}
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 40px;
  width: 360px;
}
.login-box label {
  display: block;
  color: var(--text2);
  font-size: 0.8rem;
  letter-spacing: 2px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.login-box input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 16px;
  font-family: inherit;
  font-size: 1.1rem;
  letter-spacing: 3px;
  outline: none;
  margin-bottom: 16px;
  transition: border-color 0.3s;
}
.login-box input:focus { border-color: var(--gold); }
.login-box button {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  border: none;
  color: var(--bg);
  font-family: inherit;
  font-size: 1rem;
  letter-spacing: 3px;
  cursor: pointer;
  transition: background 0.3s;
  margin-bottom: 12px;
}
.login-box button:hover { background: var(--gold2); }
.login-box .error {
  color: var(--danger);
  font-size: 0.85rem;
  text-align: center;
  min-height: 20px;
  letter-spacing: 1px;
}

/* ── Admin ── */
#admin-view { display: none; padding: 40px; }
.section-title {
  font-size: 1.1rem;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Upload area */
.upload-area {
  border: 2px dashed var(--border);
  padding: 40px;
  text-align: center;
  margin-bottom: 40px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}
.upload-area:hover, .upload-area.dragover {
  border-color: var(--gold);
  background: rgba(201,169,110,0.03);
}
.upload-area input[type=file] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.upload-area .icon { font-size: 2rem; margin-bottom: 12px; }
.upload-area p { color: var(--text2); font-size: 0.9rem; letter-spacing: 1px; }
.upload-area .tip { font-size: 0.75rem; margin-top: 8px; }

/* Photo grid */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 40px;
}
.photo-card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  overflow: hidden;
  aspect-ratio: 1;
}
.photo-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-card .del-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  background: rgba(0,0,0,0.7);
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.photo-card:hover .del-btn { opacity: 1; }
.photo-card .del-btn:hover { background: var(--danger); color: #fff; }

.uploading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.uploading-overlay .spin {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.uploading-overlay p { color: var(--gold); letter-spacing: 2px; font-size: 1.1rem; }
.uploading-overlay .detail { color: var(--text2); font-size: 0.8rem; margin-top: 8px; }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 28px;
  letter-spacing: 1px;
  font-size: 0.9rem;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }

.stats-bar {
  display: flex;
  gap: 30px;
  margin-bottom: 30px;
}
.stats-bar .stat {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 16px 24px;
}
.stats-bar .stat .num {
  font-size: 2rem;
  color: var(--gold);
  letter-spacing: 1px;
}
.stats-bar .stat .label {
  font-size: 0.75rem;
  color: var(--text2);
  letter-spacing: 2px;
  text-transform: uppercase;
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">烂片王中王<span>· ORGIL</span></a>
  <div class="nav-right">
    <a href="index.html" class="btn">返回首页</a>
    <a class="btn" onclick="logout()">退出</a>
  </div>
</nav>

<!-- 登录页 -->
<div id="login-view">
  <h1>管理后台</h1>
  <p class="sub">PORTFOLIO ADMIN</p>
  <div class="login-box">
    <label>口 令</label>
    <input type="password" id="pw-input" placeholder="••••" autocomplete="off">
    <button onclick="checkLogin()">进 入</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- 管理页 -->
<div id="admin-view">
  <div class="stats-bar">
    <div class="stat"><div class="num" id="stat-total">–</div><div class="label">全部照片</div></div>
    <div class="stat"><div class="num" id="stat-loaded">–</div><div class="label">已加载</div></div>
  </div>

  <p class="section-title">添 加 照 片</p>
  <div class="upload-area" id="upload-area">
    <div class="icon">+</div>
    <p>点击或拖拽上传照片</p>
    <p class="tip">支持 JPG / JPEG / PNG，添加后自动部署</p>
    <input type="file" id="file-input" accept="image/jpeg,image/jpg,image/png" multiple>
  </div>

  <p class="section-title">管 理 照 片</p>
  <div class="photo-grid" id="photo-grid"></div>
</div>

<!-- 上传遮罩 -->
<div class="uploading-overlay" id="uploading-overlay" style="display:none">
  <div class="spin"></div>
  <p id="upload-msg">正在上传...</p>
  <div class="detail" id="upload-detail"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Config ──
const USER = 'aorigele5815';
const REPO = 'aorigele5815.github.io';
const BRANCH = 'main';
const PHOTO_DIR = 'portfolio/photos';
const THUMB_DIR = 'portfolio/photos/thumbs';
const PASS_HASH = '2a3d253e5273a3e67096224cca77d84c7fc096b0515320989df59d4b177636fe';
const GH_TOKEN = 'YOUR_TOKEN_HERE';  // TODO: fill in your GitHub PAT
const GITHUB_PAGES = 'https://aorigele5815.github.io';
const THUMB_W = 600;

// ── Utils ──
function sha256(str) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
    .then(buf => Array.from(new Uint8Array(buf)))
    .then(arr => arr.map(b => b.toString(16).padStart(2,'0')).join(''));
}

async function hashPass(pw) {
  return await sha256(pw);
}

function toast(msg, type='normal') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type !== 'normal' ? ' '+type : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function showOverlay(msg, detail='') {
  document.getElementById('uploading-overlay').style.display = 'flex';
  document.getElementById('upload-msg').textContent = msg;
  document.getElementById('upload-detail').textContent = detail;
}
function hideOverlay() {
  document.getElementById('uploading-overlay').style.display = 'none';
}

// ── Auth ──
async function checkLogin() {
  const pw = document.getElementById('pw-input').value;
  const hash = await hashPass(pw);
  if (hash !== PASS_HASH) {
    document.getElementById('login-error').textContent = '口令错误';
    return;
  }
  sessionStorage.setItem('logged_in', '1');
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('admin-view').style.display = 'block';
  loadPhotos();
}

function logout() {
  sessionStorage.removeItem('logged_in');
  location.reload();
}

// Auto-login check
if (sessionStorage.getItem('logged_in') === '1') {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('admin-view').style.display = 'block';
  loadPhotos();
}

// ── GitHub API ──
function ghHeaders() {
  return {
    'Authorization': 'token ' + GH_TOKEN,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };
}

async function ghApi(method, path, data) {
  const res = await fetch('https://api.github.com' + path, {
    method,
    headers: ghHeaders(),
    body: data ? JSON.stringify(data) : undefined
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

async function uploadBlob(content) {
  const b64 = btoa(Array.from(new Uint8Array(content))
    .map(b => String.fromCharCode(b)).join(''));
  return ghApi('POST', `/repos/${USER}/${REPO}/git/blobs`, {
    content: b64,
    encoding: 'base64'
  });
}

async function getCurrentTree() {
  const ref = await ghApi('GET', `/repos/${USER}/${REPO}/git/refs/heads/${BRANCH}`);
  const commit = await ghApi('GET', `/repos/${USER}/${REPO}/git/commits/${ref.object.sha}`);
  return commit.commit.tree.sha;
}

async function getExistingFiles(dir) {
  try {
    const files = await ghApi('GET', `/repos/${USER}/${REPO}/contents/${dir}?ref=${BRANCH}`);
    return Array.isArray(files) ? files : [];
  } catch {
    return [];
  }
}
async function getExistingPhotos() { return getExistingFiles(PHOTO_DIR); }
async function getExistingThumbs() { return getExistingFiles(THUMB_DIR); }

async function loadPhotos() {
  const grid = document.getElementById('photo-grid');
  const statTotal = document.getElementById('stat-total');
  const statLoaded = document.getElementById('stat-loaded');

  grid.innerHTML = '<p style="color:var(--text2);grid-column:1/-1;text-align:center;padding:40px;letter-spacing:2px">加载中...</p>';

  try {
    const files = await getExistingPhotos();
    statTotal.textContent = files.length;
    statLoaded.textContent = '–';

    if (files.length === 0) {
      grid.innerHTML = '<p style="color:var(--text2);grid-column:1/-1;text-align:center;padding:40px;letter-spacing:2px">暂无照片，请上传</p>';
      return;
    }

    const thumbs = await getExistingThumbs();
    const thumbMap = {};
    thumbs.forEach(t => { thumbMap[t.name.toLowerCase()] = t; });

    grid.innerHTML = '';
    files.forEach(f => {
      const thumb = thumbMap[f.name.toLowerCase()];
      const card = document.createElement('div');
      card.className = 'photo-card';
      const imgSrc = thumb
        ? `${GITHUB_PAGES}/${THUMB_DIR}/${thumb.name}?t=${Date.now()}`
        : `${GITHUB_PAGES}/${PHOTO_DIR}/${f.name}?t=${Date.now()}`;
      card.innerHTML = `
        <img src="${imgSrc}" alt="" loading="lazy" onerror="this.style.display='none'">
        <button class="del-btn" title="删除" data-name="${f.name}" data-sha="${f.sha}" data-thumb="${thumb ? thumb.name : ''}" data-thumb-sha="${thumb ? thumb.sha : ''}">✕</button>
      `;
      grid.appendChild(card);

      card.querySelector('.del-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const name = f.name;
        const sha = f.sha;
        const thumbName = thumb ? thumb.name : '';
        const thumbSha = thumb ? thumb.sha : '';
        if (!confirm(`确认删除 ${name}？`)) return;
        showOverlay('正在删除...', name);
        try {
          await ghApi('DELETE', `/repos/${USER}/${REPO}/contents/${PHOTO_DIR}/${name}`, {
            message: `Delete photo: ${name}`,
            sha
          });
          if (thumbSha) {
            await ghApi('DELETE', `/repos/${USER}/${REPO}/contents/${THUMB_DIR}/${thumbName}`, {
              message: `Delete thumb: ${thumbName}`,
              sha: thumbSha
            });
          }
          toast('已删除: ' + name, 'success');
          card.remove();
          const remaining = grid.querySelectorAll('.photo-card').length;
          statTotal.textContent = remaining;
          statLoaded.textContent = remaining;
          await triggerDeploy();
        } catch(err) {
          toast('删除失败: ' + err.message, 'error');
        } finally {
          hideOverlay();
        }
      });
    });

    statLoaded.textContent = files.length;

  } catch(err) {
    grid.innerHTML = `<p style="color:var(--danger);grid-column:1/-1;text-align:center;padding:40px;letter-spacing:1px">加载失败: ${err.message}</p>`;
  }
}

// ── Upload ──
const uploadArea = document.getElementById('upload-area');
const fileInput = document.getElementById('file-input');

uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));

async function handleFiles(files) {
  if (!files.length) return;

  const jpegs = Array.from(files).filter(f =>
    f.type === 'image/jpeg' || f.type === 'image/jpg' || f.type === 'image/png'
  );
  if (!jpegs.length) { toast('仅支持 JPG / PNG 格式', 'error'); return; }

  showOverlay('准备上传...', `${jpegs.length} 个文件`);

  try {
    const [existing, existingThumbs] = await Promise.all([getExistingPhotos(), getExistingThumbs()]);
    const existingNames = new Set(existing.map(f => f.name.toLowerCase()));
    const existingThumbNames = new Set(existingThumbs.map(t => t.name.toLowerCase()));

    const baseTree = await getCurrentTree();
    const treeItems = [];
    const newBlobs = [];
    const newNames = [];

    for (let i = 0; i < jpegs.length; i++) {
      const f = jpegs[i];
      const ext = f.type === 'image/png' ? 'png' : 'jpeg';
      const ts = Date.now();
      const uuid = crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Math.random().toString(36).slice(2);
      let name = `${ts}_${uuid}.${ext}`;

      let counter = 1;
      while (existingNames.has(name.toLowerCase()) || newNames.map(n=>n.toLowerCase()).includes(name.toLowerCase())) {
        name = `${ts}_${uuid}_${counter}.${ext}`;
        counter++;
      }

      showOverlay(`生成缩略图... ${i+1}/${jpegs.length}`, f.name);
      const buf = await f.arrayBuffer();
      const thumbBuf = await generateThumb(new Uint8Array(buf), ext);

      showOverlay(`上传中 ${i+1}/${jpegs.length}`, f.name);
      const [blob, thumbBlob] = await Promise.all([
        uploadBlob(new Uint8Array(buf)),
        uploadBlob(thumbBuf)
      ]);
      newBlobs.push({ name, sha: blob.sha, content: buf, thumbName: name, thumbSha: thumbBlob.sha, thumbContent: thumbBuf });
      newNames.push(name);
      existingNames.add(name.toLowerCase());
      existingThumbNames.add(name.toLowerCase());
    }

    // Build tree: existing photos + thumbs + new photos + new thumbs
    for (const f of existing) {
      treeItems.push({ path: `${PHOTO_DIR}/${f.name}`, mode: '100644', type: 'blob', sha: f.sha });
    }
    for (const t of existingThumbs) {
      treeItems.push({ path: `${THUMB_DIR}/${t.name}`, mode: '100644', type: 'blob', sha: t.sha });
    }
    for (const item of newBlobs) {
      treeItems.push({ path: `${PHOTO_DIR}/${item.name}`, mode: '100644', type: 'blob', sha: item.sha });
      treeItems.push({ path: `${THUMB_DIR}/${item.thumbName}`, mode: '100644', type: 'blob', sha: item.thumbSha });
    }

    showOverlay('创建提交...', '');

    const ref = await ghApi('GET', `/repos/${USER}/${REPO}/git/refs/heads/${BRANCH}`);
    const tree = await ghApi('POST', `/repos/${USER}/${REPO}/git/trees`, {
      base_tree: baseTree,
      tree: treeItems
    });
    const commit = await ghApi('POST', `/repos/${USER}/${REPO}/git/commits`, {
      message: `Add ${newNames.length} photo(s) with thumbs\nAdded via admin panel`,
      tree: tree.sha,
      parents: [ref.object.sha]
    });
    await ghApi('PATCH', `/repos/${USER}/${REPO}/git/refs/heads/${BRANCH}`, { sha: commit.sha });

    toast(`上传成功 ${newNames.length} 个文件（含缩略图）`, 'success');
    await triggerDeploy();
    loadPhotos();

  } catch(err) {
    toast('上传失败: ' + err.message, 'error');
  } finally {
    hideOverlay();
    fileInput.value = '';
  }
}

// ── Thumbnail generator (canvas) ──
async function generateThumb(buf, ext) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([buf], { type: ext === 'png' ? 'image/png' : 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ratio = Math.max(1, img.width / THUMB_W);
      canvas.width = Math.round(img.width / ratio);
      canvas.height = Math.round(img.height / ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob2 => {
        blob2.arrayBuffer().then(ab => resolve(new Uint8Array(ab)));
      }, ext === 'png' ? 'image/png' : 'image/jpeg', 0.85);
    };
    img.onerror = reject;
    img.src = url;
  });
}

// ── Deploy ──
async function triggerDeploy() {
  try {
    await ghApi('POST', `/repos/${USER}/${REPO}/pages/builds`);
  } catch {}
}
</script>
</body>
</html>
