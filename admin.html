<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烂片王中王 · 管理后台</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --card: #111;
  --border: #222;
  --gold: #c9a96e;
  --gold2: #a8895a;
  --text: #e8e8e8;
  --text2: #888;
  --danger: #c0392b;
  --success: #27ae60;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid var(--border);
}
.nav .logo {
  font-size: 1.2rem;
  letter-spacing: 2px;
  color: var(--gold);
  text-decoration: none;
}
.nav .logo span { color: var(--text2); font-size: 0.9rem; margin-left: 12px; }
.nav-right { display: flex; gap: 12px; align-items: center; }
.nav a.btn {
  padding: 8px 20px;
  border: 1px solid var(--gold);
  color: var(--gold);
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 1px;
  transition: all 0.3s;
  cursor: pointer;
}
.nav a.btn:hover { background: var(--gold); color: var(--bg); }
.sync-btn {
  border-color: var(--success) !important;
  color: var(--success) !important;
}
.sync-btn:hover { background: var(--success) !important; color: var(--bg) !important; }
.sync-btn.syncing {
  opacity: 0.6;
  pointer-events: none;
}
.sync-btn .spin-dot {
  display: inline-block;
  width: 10px; height: 10px;
  border: 2px solid var(--success);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
#login-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 80px);
  padding: 40px;
}
#login-view h1 {
  font-size: 2rem;
  font-weight: 300;
  color: var(--gold);
  margin-bottom: 8px;
  letter-spacing: 4px;
}
#login-view .sub {
  color: var(--text2);
  font-size: 1rem;
  margin-bottom: 40px;
  letter-spacing: 2px;
}
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 40px;
  width: 360px;
}
.login-box label {
  display: block;
  color: var(--text2);
  font-size: 0.8rem;
  letter-spacing: 2px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.login-box input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 16px;
  font-family: inherit;
  font-size: 1.1rem;
  letter-spacing: 3px;
  outline: none;
  margin-bottom: 16px;
  transition: border-color 0.3s;
}
.login-box input:focus { border-color: var(--gold); }
.login-box button {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  border: none;
  color: var(--bg);
  font-family: inherit;
  font-size: 1rem;
  letter-spacing: 3px;
  cursor: pointer;
  transition: background 0.3s;
  margin-bottom: 12px;
}
.login-box button:hover { background: var(--gold2); }
.login-box .error {
  color: var(--danger);
  font-size: 0.85rem;
  text-align: center;
  min-height: 20px;
  letter-spacing: 1px;
}
#admin-view { display: none; padding: 40px; }
.section-title {
  font-size: 1.1rem;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.upload-area {
  border: 2px dashed var(--border);
  padding: 40px;
  text-align: center;
  margin-bottom: 40px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}
.upload-area:hover, .upload-area.dragover {
  border-color: var(--gold);
  background: rgba(201,169,110,0.03);
}
.upload-area input[type=file] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.upload-area .icon { font-size: 2rem; margin-bottom: 12px; }
.upload-area p { color: var(--text2); font-size: 0.9rem; letter-spacing: 1px; }
.upload-area .tip { font-size: 0.75rem; margin-top: 8px; }
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 40px;
}
.photo-card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  overflow: hidden;
  aspect-ratio: 1;
}
.photo-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-card .del-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  background: rgba(0,0,0,0.7);
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.photo-card:hover .del-btn { opacity: 1; }
.photo-card .del-btn:hover { background: var(--danger); color: #fff; }
.uploading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.uploading-overlay .spin {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.uploading-overlay p { color: var(--gold); letter-spacing: 2px; font-size: 1.1rem; }
.uploading-overlay .detail { color: var(--text2); font-size: 0.8rem; margin-top: 8px; }
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 28px;
  letter-spacing: 1px;
  font-size: 0.9rem;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }
.stats-bar {
  display: flex;
  gap: 30px;
  margin-bottom: 30px;
}
.stats-bar .stat {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 16px 24px;
}
.stats-bar .stat .num {
  font-size: 2rem;
  color: var(--gold);
  letter-spacing: 1px;
}
.stats-bar .stat .label {
  font-size: 0.75rem;
  color: var(--text2);
  letter-spacing: 2px;
  text-transform: uppercase;
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">烂片王中王<span>· ORGIL</span></a>
  <div class="nav-right">
    <a class="btn sync-btn" id="sync-btn" onclick="doSync()">同步前端</a>
    <a href="index.html" class="btn">返回首页</a>
    <a class="btn" onclick="logout()">退出</a>
  </div>
</nav>
<!-- 登录页 -->
<div id="login-view">
  <h1>管理后台</h1>
  <p class="sub">PORTFOLIO ADMIN</p>
  <div class="login-box">
    <label>口 令</label>
    <input type="password" id="pw-input" placeholder="••••" autocomplete="off">
    <button onclick="checkLogin()">进 入</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<div id="admin-view">
  <div class="stats-bar">
    <div class="stat"><div class="num" id="stat-total">–</div><div class="label">全部照片</div></div>
  </div>
  <p class="section-title">添 加 照 片</p>
  <div class="upload-area" id="upload-area">
    <div class="icon">+</div>
    <p>点击或拖拽上传照片</p>
    <p class="tip">支持 JPG / JPEG / PNG / WEBP，添加后自动部署</p>
    <input type="file" id="file-input" accept="image/*" multiple>
  </div>
  <p class="section-title">管 理 照 片</p>
  <div class="photo-grid" id="photo-grid"></div>
</div>

<div class="uploading-overlay" id="uploading-overlay" style="display:none">
  <div class="spin"></div>
  <p id="upload-msg">正在上传...</p>
  <div class="detail" id="upload-detail"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──
const PASS_HASH = '2a3d253e5273a3e67096224cca77d84c7fc096b0515320989df59d4b177636fe';
const IMGBB_KEY = '454a453fc00876d805dd9b1a505db101';
const GH_TOKEN = '3Cip6qlBexjosiIK3Z57I4TNedT';
const GH_USER = 'aorigele5815';
const GH_REPO = 'photo-portfolio';
const GH_BRANCH = 'main';
const GH_PHOTOS_FILE = 'photos.json';

// ── Utils ──
function sha256(str) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
    .then(buf => Array.from(new Uint8Array(buf)))
    .then(arr => arr.map(b => b.toString(16).padStart(2,'0')).join(''));
}

async function hashPass(pw) { return await sha256(pw); }

function toast(msg, type='normal') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type !== 'normal' ? ' '+type : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function showOverlay(msg, detail='') {
  document.getElementById('uploading-overlay').style.display = 'flex';
  document.getElementById('upload-msg').textContent = msg;
  document.getElementById('upload-detail').textContent = detail;
}
function hideOverlay() { document.getElementById('uploading-overlay').style.display = 'none'; }

// ── Auth ──
async function checkLogin() {
  const pw = document.getElementById('pw-input').value;
  const hash = await hashPass(pw);
  if (hash !== PASS_HASH) { document.getElementById('login-error').textContent = '口令错误'; return; }
  sessionStorage.setItem('logged_in', '1');
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('admin-view').style.display = 'block';
  loadPhotos();
}

function logout() {
  sessionStorage.removeItem('logged_in');
  location.reload();
}

// Auto-run: password only, token pre-configured
(function init() {
  if (sessionStorage.getItem('logged_in') === '1') {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('admin-view').style.display = 'block';
    loadPhotos();
  } else {
    document.getElementById('login-view').style.display = 'flex';
  }
})();

// ── GitHub API ──
function ghHeaders() {
  return {
    'Authorization': 'token ' + GH_TOKEN,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };
}

async function ghApi(method, path, data) {
  const res = await fetch('https://api.github.com' + path, {
    method,
    headers: ghHeaders(),
    body: data ? JSON.stringify(data) : undefined
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

// ── ImgBB Upload ──
async function uploadImgBB(file) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    form.append('image', file);
    form.append('key', IMGBB_KEY);
    fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: form })
      .then(r => r.json())
      .then(data => {
        if (data.success) resolve(data.data);
        else reject(new Error(data.error?.message || 'ImgBB上传失败'));
      })
      .catch(reject);
  });
}

// ── Photos list ──
async function loadPhotoList() {
  // token hardcoded
  try {
    const r = await ghApi('GET', `/repos/${GH_USER}/${GH_REPO}/contents/${GH_PHOTOS_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`);
    return JSON.parse(atob(r.content));
  } catch { return []; }
}

async function savePhotoList(list) {
  const content = JSON.stringify(list, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(content)));
  const existing = await ghApi('GET', `/repos/${GH_USER}/${GH_REPO}/contents/${GH_PHOTOS_FILE}?ref=${GH_BRANCH}`);
  await ghApi('PUT', `/repos/${GH_USER}/${GH_REPO}/contents/${GH_PHOTOS_FILE}`, {
    message: 'Update photos list',
    content: encoded,
    sha: existing.sha
  });
  // 触发 Cloudflare Pages 重建
  await triggerCFDeploy();
}

const CF_ACCOUNT_ID = '38b114fc42e8ef8c31f49eda5bc2fec0';
async function triggerCFDeploy() {
  const cfKey = localStorage.getItem('cf_api_key');
  const cfEmail = localStorage.getItem('cf_email');
  if (!cfKey || !cfEmail) return;
  try {
    await fetch(`https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/photo-portfolio/deployments`, {
      method: 'POST',
      headers: { 'X-Auth-Email': cfEmail, 'X-Auth-Key': cfKey, 'Content-Type': 'application/json' }
    });
  } catch(e) { /* non-critical */ }
}

// ── Render ──
async function loadPhotos() {
  const grid = document.getElementById('photo-grid');
  const statTotal = document.getElementById('stat-total');
  grid.innerHTML = '<p style="color:var(--text2);grid-column:1/-1;text-align:center;padding:40px;letter-spacing:2px">加载中...</p>';
  try {
    const photos = await loadPhotoList();
    statTotal.textContent = photos.length;
    grid.innerHTML = '';
    if (!photos.length) {
      grid.innerHTML = '<p style="color:var(--text2);grid-column:1/-1;text-align:center;padding:40px">暂无照片，请上传</p>';
      return;
    }
    photos.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = `
        <img src="${p.thumb || p.url}" alt="" loading="lazy" onerror="this.src='${p.url}'">
        <button class="del-btn" title="删除" data-idx="${idx}" data-name="${p.name}">✕</button>
      `;
      grid.appendChild(card);
      card.querySelector('.del-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const name = p.name;
        if (!confirm(`确认删除 ${name}？`)) return;
        showOverlay('正在删除...', name);
        try {
          const currentList = await loadPhotoList();
          const newList = currentList.filter(p => p.name !== name);
          await savePhotoList(newList);
          toast('已删除: ' + name, 'success');
          await loadPhotos();
        } catch(err) {
          console.error('Delete error:', err);
          toast('删除失败: ' + err.message, 'error');
        } finally {
          hideOverlay();
        }
      });
    });
  } catch(err) {
    grid.innerHTML = `<p style="color:var(--danger);grid-column:1/-1;text-align:center;padding:40px">加载失败: ${err.message}</p>`;
  }
}

// ── Sync ──
const CF_ACCOUNT_ID = '38b114fc42e8ef8c31f49eda5bc2fec0';

function setSyncBtnState(loading) {
  const btn = document.getElementById('sync-btn');
  if (!btn) return;
  if (loading) {
    btn.classList.add('syncing');
    btn.innerHTML = '<span class="spin-dot"></span>同步中...';
  } else {
    btn.classList.remove('syncing');
    btn.textContent = '同步前端';
  }
}

async function doSync() {
  if (!GH_TOKEN) { toast('请先配置 GitHub Token', 'error'); return; }
  setSyncBtnState(true);
  showOverlay('正在同步...', '获取 GitHub 数据');
  try {
    // 1. 获取 photos.json 和 index.html 的 SHA
    const [photosRes, indexRes] = await Promise.all([
      ghApi('GET', `/repos/${GH_USER}/${GH_REPO}/contents/${GH_PHOTOS_FILE}?ref=${GH_BRANCH}`),
      ghApi('GET', `/repos/${GH_USER}/${GH_REPO}/contents/index.html?ref=${GH_BRANCH}`)
    ]);

    // 2. 拉取最新的 photos.json 内容
    const photosContent = JSON.parse(atob(photosRes.content));
    const photosEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(photosContent, null, 2))));

    showOverlay('同步中...', '推送 photos.json');
    // 3. 推送 photos.json
    await ghApi('PUT', `/repos/${GH_USER}/${GH_REPO}/contents/${GH_PHOTOS_FILE}`, {
      message: `Sync photos (${photosContent.length} photos)`,
      content: photosEncoded,
      sha: photosRes.sha
    });

    // 4. 触发 Cloudflare Pages 部署
    showOverlay('同步中...', '触发 CF Pages 部署');
    await triggerCFDeploy();

    toast(`同步完成，共 ${photosContent.length} 张照片`, 'success');
  } catch(err) {
    console.error('Sync error:', err);
    toast('同步失败: ' + err.message, 'error');
  } finally {
    setSyncBtnState(false);
    hideOverlay();
  }
}


const uploadArea = document.getElementById('upload-area');
const fileInput = document.getElementById('file-input');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

async function handleFiles(files) {
  if (!files.length) return;
  const imgs = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!imgs.length) { toast('仅支持图片格式', 'error'); return; }
  showOverlay('准备上传...', `${imgs.length} 个文件`);
  try {
    const list = await loadPhotoList();
    const newEntries = [];
    for (let i = 0; i < imgs.length; i++) {
      const f = imgs[i];
      showOverlay(`上传中 ${i+1}/${imgs.length}`, f.name);
      const result = await uploadImgBB(f);
      newEntries.push({ name: f.name, url: result.url, thumb: result.thumb?.url || result.url, time: Date.now() });
    }
    const merged = [...newEntries, ...list];
    showOverlay('保存列表...', '');
    await savePhotoList(merged);
    toast(`上传成功 ${newEntries.length} 个文件`, 'success');
    await loadPhotos();
  } catch(err) {
    toast('上传失败: ' + err.message, 'error');
  } finally {
    hideOverlay();
    fileInput.value = '';
  }
}
</script>
</body>
</html>
